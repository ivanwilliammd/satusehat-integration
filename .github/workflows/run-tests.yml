name: Tests

on:
  push:
    paths:
      - "**.php"
      - ".github/workflows/run-tests.yml"
      - "phpunit.xml.dist"
      - "composer.json"
      - "composer.lock"

jobs:

  # ── Unix ──
  test-unix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        php: [8.0, 8.1, 8.3, 8.5]

    name: Unix / PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      # PHP 8.0 tidak bisa menjalankan PHPUnit lagi (php-code-coverage menyentuh T_READONLY yang
      # baru ada di 8.1). Yang bisa dibuktikan di 8.0 — dan justru yang dijanjikan kepada pemakai —
      # adalah src/ bebas parse error. Suite penuh berjalan di 8.1+.
      - name: Lint sintaks (lantai versi)
        if: matrix.php == '8.0'
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null && echo "parse 8.0 bersih"

      - name: Execute tests
        if: matrix.php != '8.0'
        run: vendor/bin/phpunit

  # ── Windows (pcntl unavailable — PHP 8.0+ only) ──
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        php: [8.0, 8.1, 8.3, 8.5]

    name: Windows / PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      # PHP 8.0 tidak bisa menjalankan PHPUnit lagi (php-code-coverage menyentuh T_READONLY yang
      # baru ada di 8.1). Yang bisa dibuktikan di 8.0 — dan justru yang dijanjikan kepada pemakai —
      # adalah src/ bebas parse error. Suite penuh berjalan di 8.1+.
      - name: Lint sintaks (lantai versi)
        if: matrix.php == '8.0'
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null && echo "parse 8.0 bersih"

      - name: Execute tests
        if: matrix.php != '8.0'
        run: vendor/bin/phpunit
