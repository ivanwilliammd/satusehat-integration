name: Tests

on:
  push:
    paths:
      - "**.php"
      - ".github/workflows/run-tests.yml"
      - "phpunit.xml.dist"
      - "composer.json"
      - "composer.lock"

jobs:

  # ── Unix: PHP 7.4 (prefer-lowest only) + PHP 8.3 (full matrix) ──
  # Note: prefer-stable on 7.4 installs PHP 8.3+ deps → skip it for 7.4.
  # prefer-lowest re-resolves from composer.json and picks v8.x of illuminate/* on 7.4.
  test-unix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        php: [7.4, 8.3]
        stability: [prefer-lowest]
        include:
          - php: 8.3
            stability: prefer-stable
        exclude:
          - php: 8.3
            stability: prefer-lowest

    name: Unix / PHP ${{ matrix.php }} / ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit

  # ── Windows: PHP 8.3 only (pcntl unavailable on Windows) ──
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        php: [8.3]
        stability: [prefer-lowest, prefer-stable]

    name: Windows / PHP ${{ matrix.php }} / ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit
